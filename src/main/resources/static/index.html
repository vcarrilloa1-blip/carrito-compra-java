<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Carrito de compras</title>
        <style>
@import url('https://fonts.googleapis.com/css2?family=ADLaM+Display&display=swap');

* {
    box-sizing: border-box;
}

body {
    font-family: 'ADLaM Display', sans-serif;
    background: #f4f5f4;
    color: #292929;
    margin: 0;
    padding: 25px;
}

h1 {
    text-align: center;
    color: #ffffff;
    background: #176b45;
    padding: 20px;
    margin: -25px -25px 30px -25px;
}

h2 {
    color: #ffffff;
    background: #287c50;
    text-align: center;
    padding: 14px;
    border-radius: 5px;
    margin: 25px auto;
    max-width: 900px;
}

#productos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
}

.producto {
    background: #ffffff;
    padding: 18px;
    border: 1px solid #dddddd;
    border-radius: 6px;
    text-align: center;
}

.producto img {
    width: 100%;
    height: 160px;
    object-fit: contain;
    background: #ffffff;
}

.producto p {
    margin: 12px 0;
}

button {
    background: #287c50;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    margin: 5px 0;
}

button:hover {
    background: #1d613d;
}

#carrito {
    background: #ffffff;
    padding: 18px;
    border: 1px solid #dddddd;
    border-radius: 6px;
    margin: 20px auto;
    max-width: 900px;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    h1 {
        margin: -12px -12px 20px -12px;
        font-size: 25px;
    }

    #productos {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
  <body>
    <h1>Carrito de compras</h1>

    <h2>Productos disponibles</h2>
    <div id="productos"></div>

    <h2>Mi carrito</h2>
    <div id="carrito"></div>

    <script>
        async function cargarProductos() {
            const respuesta = await fetch('/api/productos');
            const productos = await respuesta.json();

            const contenedor = document.getElementById('productos');
            contenedor.innerHTML = '';

            productos.forEach(producto => {
                const elemento = document.createElement('div');

                elemento.innerHTML = `
                    <h3>${producto.nombre}</h3>
                    <img src="/${producto.imagen}" alt="${producto.nombre}" width="180">
                    <p>Precio: Q${producto.precio}</p>
                    <button onclick="agregarAlCarrito(${producto.idProducto})">
                        Agregar al carrito
                    </button>
                    <hr>
                `;

                contenedor.appendChild(elemento);
            });
        }

        async function cargarCarrito() {
            const respuesta = await fetch('/api/carrito');
            const productos = await respuesta.json();

            const contenedor = document.getElementById('carrito');
            contenedor.innerHTML = '';

            if (productos.length === 0) {
                contenedor.textContent = 'El carrito está vacío.';
                return;
            }

            productos.forEach(item => {
                const elemento = document.createElement('div');

                elemento.innerHTML = `
                    <p>Producto ID: ${item.idProducto}</p>
                    <p>Cantidad: ${item.cantidad}</p>
                    <button onclick="eliminarDelCarrito(${item.idShoppingCart})">
                        Eliminar
                    </button>
                    <hr>
                `;

                contenedor.appendChild(elemento);
            });
        }

        async function agregarAlCarrito(idProducto) {
            const respuesta = await fetch('/api/carrito', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    idProducto: idProducto,
                    codUsuario: 'prueba1',
                    cantidad: 1
                })
            });

            if (respuesta.ok) {
                await cargarCarrito();
                alert('Producto agregado al carrito.');
            } else {
                alert('No se pudo agregar el producto.');
            }
        }

        async function eliminarDelCarrito(id) {
            const respuesta = await fetch('/api/carrito/' + id, {
                method: 'DELETE'
            });

            if (respuesta.ok) {
                await cargarCarrito();
            } else {
                alert('No se pudo eliminar el producto.');
            }
        }

        cargarProductos();
        cargarCarrito();
    </script>
</body>
</html>
